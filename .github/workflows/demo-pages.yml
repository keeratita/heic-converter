name: Demo Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Workflow default: no token available to any job. The elevated Pages/OIDC
# permissions live on the deploy job only, which never installs dependencies —
# `npm ci` runs the install scripts of the dev tree (the repo's only code-
# execution surface), and an ACTIONS_ID_TOKEN_REQUEST_TOKEN exported to that
# job would let a compromised dev dependency mint tokens or republish the demo
# page where users drop personal photos. Same split as publish.yml.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc' # single source of truth for the dev/CI runtime
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Prepare site artifact
        run: |
          mkdir -p site
          cp docs/index.html site/index.html
          cp docs/demo.js site/demo.js
          cp docs/worker.js site/worker.js
          cp -R dist site/dist
          # Worker mode on the demo page fetches /worker.js; fail the build
          # instead of shipping a site whose worker 404s.
          test -f site/worker.js

      - name: Upload site for deploy
        # The deploy job holds the elevated permissions and must not build
        # anything; it publishes exactly these prepared bytes.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site
          if-no-files-found: error

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Download prepared site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae9b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
