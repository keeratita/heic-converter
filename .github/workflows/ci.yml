name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Build Library
      run: npm run build

    - name: Verify WASM Artifacts Exist
      run: test -f dist/heic-decoder.wasm && test -f test/fixtures/example.heic

    - name: Run Unit Tests (coverage thresholds enforced)
      run: npm run test:coverage

    - name: Install Playwright Chromium
      run: npx playwright install chromium

    - name: Run Browser E2E Tests (CSP Sandbox + GitHub Pages Demo)
      run: node test/browser/test-playwright.mjs
