name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    # No submodules: CI never compiles the C++ sources (the WASM artifacts are
    # committed and hash-verified below); `npm run build:wasm` is the only
    # step that needs them, and it requires Docker.
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false # no job here pushes; don't leave a git credential behind

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    # Fails if a dev dependency started running code at install time. The only
    # entry today is esbuild; see build-scripts/install-scripts.json.
    - name: Verify Install-Script Allowlist
      run: npm run check:scripts

    - name: Verify WASM Artifacts (pinned hashes + CSP scan)
      run: node build-scripts/verify-wasm-artifacts.mjs

    - name: Build Library
      run: npm run build

    - name: Verify Build Artifacts Exist
      # Every fixture the real-WASM suites gate on (integration, decoder,
      # wasm-golden). Those suites fail hard on CI when something is missing, so
      # this step exists to say which file, before a wall of test output.
      run: |
        test -f dist/heic-decoder.wasm
        for f in example.heic colors-no-alpha.heic colors-with-alpha.heic \
                 exif-orientation-6.heic irot-orientation-6.heic; do
          test -f "test/fixtures/$f" || { echo "missing test/fixtures/$f" >&2; exit 1; }
        done

    - name: Run Unit Tests (coverage thresholds enforced)
      run: npm run test:coverage

    - name: Install Playwright Chromium
      run: npx playwright install chromium

    - name: Run Browser E2E Tests (CSP Sandbox + GitHub Pages Demo)
      run: node test/browser/test-playwright.mjs
