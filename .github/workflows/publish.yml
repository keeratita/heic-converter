name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Required for npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24' # npm >= 11.5.1 is required for trusted publishing
        registry-url: 'https://registry.npmjs.org'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Verify tag matches package version
      run: |
        TAG="${GITHUB_REF_NAME#v}"
        PKG="$(node -p "require('./package.json').version")"
        if [ "$TAG" != "$PKG" ]; then
          echo "::error::Tag v$TAG does not match package.json version $PKG"
          exit 1
        fi

    - name: Build Library
      run: npm run build

    - name: Verify WASM Artifacts Exist
      run: test -f dist/heic-decoder.wasm && test -f dist/heic-decoder.wasm.gz && test -f dist/heic-decoder.wasm.br

    - name: Run Unit Tests
      run: npm test

    - name: Publish to npm (OIDC trusted publishing)
      run: npm publish --access public
