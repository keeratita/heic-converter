name: Publish

# Tag pushes are the only publish path (release.mjs creates the tags).
# workflow_dispatch was removed on purpose: it let anyone with write access
# publish arbitrary branch content to npm.
on:
  push:
    tags:
      - 'v*'

jobs:
  # Everything that needs `npm ci` runs WITHOUT the OIDC token: npm ci executes
  # the install scripts of dev dependencies (esbuild, and fsevents on macOS),
  # and ACTIONS_ID_TOKEN_REQUEST_TOKEN is exported to every step of a job that
  # holds id-token: write. A compromised dev dependency must not be able to
  # mint an npm token while it runs.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false # no job here pushes; don't leave a git credential behind

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    # Mirrors ci.yml: a release must not be able to publish bytes that CI would
    # have rejected (the husky hooks are not installed on a tag-push runner).
    - name: Lint
      run: npm run lint

    - name: Verify Install-Script Allowlist
      run: npm run check:scripts

    - name: Verify WASM Artifacts (pinned hashes + CSP scan)
      run: npm run verify:wasm

    - name: Typecheck Sources and Tests
      run: npm run typecheck

    - name: Build Library
      run: npm run build

    - name: Verify Build Artifacts Exist
      run: |
        test -f dist/heic-decoder.wasm
        test -f dist/heic-decoder.wasm.gz
        test -f dist/heic-decoder.wasm.br
        test -f dist/index.mjs
        test -f dist/index.js

    # Coverage thresholds (vitest.config.ts) are enforced here, so the bytes
    # that ship are the bytes the coverage gate accepted — same as CI.
    - name: Run Unit Tests (coverage thresholds enforced)
      run: npm run test:coverage

    - name: Upload dist for publishing
      # The publish job never installs dependencies, so it publishes exactly
      # these verified bytes rather than a second build.
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dist
        path: dist
        if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Required for npm trusted publishing (OIDC)
    # Configure required reviewers / branch protection for this environment in
    # the repo's Settings → Environments (it is auto-created on first run).
    environment: npm-publish

    steps:
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false # this job publishes to npm, not to git
        # Full history: the ancestry check below needs the tag's ancestors, and
        # the default depth-1 clone cannot produce a merge base.
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24' # npm >= 11.5.1 is required for trusted publishing
        registry-url: 'https://registry.npmjs.org'

    - name: Download verified dist
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: dist
        path: dist

    - name: Verify tag matches package version and is on main
      # Without the ancestry check, a tag pushed on any side branch publishes
      # arbitrary content to npm — complete with a provenance attestation that
      # names this repository, which is worse than no attestation at all.
      run: |
        TAG="${GITHUB_REF_NAME#v}"
        PKG="$(node -p "require('./package.json').version")"
        if [ "$TAG" != "$PKG" ]; then
          echo "::error::Tag v$TAG does not match package.json version $PKG"
          exit 1
        fi
        git fetch --no-tags --quiet origin main
        if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
          echo "::error::Tag $GITHUB_REF_NAME is not an ancestor of origin/main"
          exit 1
        fi

    - name: Publish to npm (OIDC trusted publishing)
      # Registry hardcoded: publishConfig.registry is honoured by npm publish,
      # so a commit could otherwise repoint the release (and the gate below)
      # at a host that will confirm anything.
      #
      # --ignore-scripts: this job deliberately has no node_modules, so the
      # package's own `prepare` (husky) would abort the publish with exit 127.
      # Nothing to build here — dist/ is the artifact the verify job tested.
      # If a lifecycle script that *produces* package content (prepack) is ever
      # added, it must move to the verify job and be covered by the artifact
      # step there, not silently skipped by this flag.
      run: npm publish --access public --ignore-scripts --registry https://registry.npmjs.org

    # Trusted publishing loses the attestation silently if the OIDC token is
    # unavailable, so read the registry's own record back and fail loudly.
    - name: Verify npm Provenance Attestation
      run: npm run verify:provenance
