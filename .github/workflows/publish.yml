name: Publish

# Tag pushes are the only publish path (release.mjs creates the tags).
# workflow_dispatch was removed on purpose: it let anyone with write access
# publish arbitrary branch content to npm.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # Required for npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Configure required reviewers / branch protection for this environment in
    # the repo's Settings → Environments (it is auto-created on first run).
    environment: npm-publish

    steps:
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24' # npm >= 11.5.1 is required for trusted publishing
        registry-url: 'https://registry.npmjs.org'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Verify tag matches package version
      run: |
        TAG="${GITHUB_REF_NAME#v}"
        PKG="$(node -p "require('./package.json').version")"
        if [ "$TAG" != "$PKG" ]; then
          echo "::error::Tag v$TAG does not match package.json version $PKG"
          exit 1
        fi

    - name: Verify WASM Artifacts (pinned hashes + CSP scan)
      run: node build-scripts/verify-wasm-artifacts.mjs

    - name: Build Library
      run: npm run build

    - name: Verify Build Artifacts Exist
      run: test -f dist/heic-decoder.wasm && test -f dist/heic-decoder.wasm.gz && test -f dist/heic-decoder.wasm.br

    - name: Run Unit Tests
      run: npm test

    - name: Publish to npm (OIDC trusted publishing)
      run: npm publish --access public
