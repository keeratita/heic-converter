# SonarQube Project Configuration
sonar.projectKey=keeratita_heic-converter
sonar.projectName=heic-converter
sonar.projectVersion=0.1.0

# Path to source directories (comma-separated)
sonar.sources=src

# Path to test directories (comma-separated)
sonar.tests=test

# Exclusions from source code analysis
sonar.exclusions=node_modules/**, dist/**, build-wasm/**, test/fixtures/**, tsup.config.ts, eslint.config.mjs

# Source encoding
sonar.sourceEncoding=UTF-8

# JavaScript / TypeScript Settings
sonar.javascript.environments=browser,node
sonar.typescript.tsconfigPath=tsconfig.json
